<!doctype html><html lang="es"><head><script src="./public-config.js"></script><script src="./public-bridge.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca · Galaxia IA</title><style>
:root{color-scheme:light;--bg:#fff;--side:#f4f5f8;--fg:#1a1e26;--dim:#606b7e;--line:#dce1eb;--accent:#315bd6}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,sans-serif;background:var(--bg);color:var(--fg)}.layout{display:flex;min-height:100dvh}aside{width:255px;background:var(--side);padding:24px 16px;flex:none;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:8px}aside a{padding:9px 13px;color:var(--fg);text-decoration:none;border-radius:9px}aside a.active{background:var(--line);font-weight:650}.brand{font-size:18px;font-weight:750;margin-bottom:22px}.bottom{margin-top:auto}main{width:100%;max-width:1350px;margin:0 auto;padding:42px 38px}h1{font-size:34px;letter-spacing:-1px;line-height:1.2;margin:0 0 10px}h2{font-size:18px;margin:0}p{color:var(--dim)}.bar,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between;margin-bottom:26px}.tools{display:flex;gap:12px;margin:24px 0}input,select,textarea,button{font:inherit;color:inherit}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;width:100%}textarea{resize:vertical;min-height:110px}label{display:grid;gap:6px;margin:16px 0;color:var(--dim);font-size:13px}button,.button{cursor:pointer;background:var(--bg);padding:9px 14px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--fg)}.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:20px}.image-card{padding:0}.image-card img{display:block;width:100%;height:230px;object-fit:cover;background:var(--side)}.image-card .info{padding:16px}.card h2{overflow-wrap:anywhere}.note{font-size:12px}.empty{padding:60px 24px;border:1px dashed var(--line);border-radius:16px;text-align:center;color:var(--dim)}dialog{max-width:570px;width:calc(100% - 32px);max-height:90dvh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--fg);padding:26px}dialog::backdrop{background:#0008}.head{display:flex;justify-content:space-between;gap:15px}.error{color:#b3261e;min-height:24px}.activity{border-left:2px solid var(--line);padding-left:14px;font-size:13px;color:var(--dim)}.activity li{margin:7px 0}a{color:var(--accent)}[hidden]{display:none!important}:focus-visible{outline:3px solid #9cb5ff;outline-offset:3px}@media(max-width:760px){.layout{display:block}aside{position:static;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.brand{width:100%;margin:0}.bottom{margin:0}main{padding:28px 18px}.tools{flex-direction:column}h1{font-size:28px}}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#181b22;--side:#11141b;--fg:#e9edf5;--dim:#a0acc0;--line:#303a4c;--accent:#567fe8}}
</style><link rel="icon" type="image/png" href="./logo.png">
<meta name="theme-color" content="#121218">

</head><body><div class="layout"><aside><a class="brand" href="./index.html"><img src="./logo.png" alt="" width="36" height="36" style="object-fit:contain;vertical-align:middle;flex:none"> <span>Galaxia IA</span></a><a href="./index.html?new=1">＋ Nuevo chat</a><a href="./index.html">☰ Chats</a><a href="./biblioteca.html?view=projects" id="projectsNav">▣ Proyectos</a><a href="./biblioteca.html?view=images" id="imagesNav">▧ Imágenes</a><a class="bottom" href="./cuenta.html">◉ Mi cuenta</a><a href="mailto:galaxia.ia.oficial@gmail.com?subject=%5BGalaxia%20IA%20soporte%5D%20Mi%20reporte" title="galaxia.ia.oficial@gmail.com">Contactar con soporte</a><a href="./descargar.html" class="foot-btn" style="text-decoration:none">↓ Descargar app</a></aside><main><div class="bar"><div><h1 id="title"></h1><p id="subtitle"></p></div><div class="actions" id="buttons"></div></div><div class="tools"><input type="search" id="search" placeholder="Buscar por nombre…" aria-label="Buscar por nombre"><select id="filter" aria-label="Filtrar por proyecto"></select></div><p id="error" class="error" role="alert"></p><div id="projectChats"></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div></main></div>
<dialog id="modal"><div class="head"><h2 id="modalTitle"></h2><button id="close" type="button" aria-label="Cerrar">✕</button></div><form id="form"><div id="fields"></div><button class="primary" id="submit">Guardar</button><p id="formError" class="error" role="alert"></p></form><ol class="activity" id="activity" aria-live="polite"></ol></dialog>
<script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),view=params.get('view')==='images'?'images':'projects';let db={projects:[],images:[]},busy=false;
function el(tag,text,cls){const x=document.createElement(tag);if(text)x.textContent=text;if(cls)x.className=cls;return x;}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...opts.headers}});if(r.status===401){location.href='./cuenta.html';throw new Error('Inicia sesión.');}const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'No se pudo completar.');return d;}
function chats(){try{return JSON.parse(localStorage.getItem(('galaxia.web.chats.'+(localStorage.getItem('galaxia.web.user')||'guest'))))?.chats||[];}catch{return [];}}
function link(text,url){const a=el('a',text,'button');a.href=url;return a;}
function field(name,title,type='text',value=''){const label=el('label',title),input=el(type==='textarea'?'textarea':'input');input.name=name;if(type!=='textarea')input.type=type;input.value=value;label.append(input);$('#fields').append(label);return input;}
function projectSelect(value=''){const label=el('label','Proyecto'),select=el('select');select.name='projectId';select.append(new Option('Sin proyecto',''));for(const p of db.projects)select.append(new Option(p.name,p.id));select.value=value;label.append(select);$('#fields').append(label);}
function log(text){$('#activity').append(el('li',new Date().toLocaleTimeString('es-ES')+' · '+text));}
async function load(){db=await api('/api/library');const selected=$('#filter').value||params.get('project')||'';$('#filter').replaceChildren(new Option('Todos los proyectos',''));for(const p of db.projects)$('#filter').append(new Option(p.name,p.id));$('#filter').value=selected;render();}
function render(){const query=$('#search').value.trim().toLocaleLowerCase(),project=$('#filter').value;$('#grid').replaceChildren();$('#projectChats').replaceChildren();
const items=(view==='images'?db.images:db.projects).filter(x=>x.name.toLocaleLowerCase().includes(query)&&(!project||(view==='images'?x.projectId:x.id)===project));
for(const item of items){const card=el('article',null,'card'+(view==='images'?' image-card':''));if(view==='images'){const img=el('img');img.src='/api/images/'+item.id;img.alt=item.name;img.loading='lazy';card.append(img);const info=el('div',null,'info');info.append(el('h2',item.name),el('p',(item.source==='generated'?'Generada con Gemini':'Subida desde tu PC')+' · '+(db.projects.find(p=>p.id===item.projectId)?.name||'Sin proyecto'),'note'));const actions=el('div',null,'actions'),open=link('Ver','/api/images/'+item.id);open.target='_blank';open.rel='noopener';const download=link('Descargar','/api/images/'+item.id);download.download=item.name.replace(/[<>:"/\\|?*]/g,'_')+'.'+({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[item.mime]||'png');const edit=el('button','Editar');edit.onclick=()=>modal('editImage',item);actions.append(open,download,edit);info.append(actions);card.append(info);}else{const count=chats().filter(c=>c.projectId===item.id).length;card.append(el('div','▣'),el('h2',item.name),el('p',item.description||'Organiza tus conversaciones e imágenes.'),el('p',count+' chats · '+db.images.filter(i=>i.projectId===item.id).length+' imágenes','note'));const actions=el('div',null,'actions');actions.append(link('Abrir proyecto','./proyecto.html?id='+item.id),link('Abrir chats','./index.html?project='+item.id),link('Imágenes','./biblioteca.html?view=images&project='+item.id));const edit=el('button','Editar');edit.onclick=()=>modal('editProject',item);actions.append(edit);card.append(actions);}$('#grid').append(card);}
$('#empty').hidden=items.length>0;$('#empty').textContent=query?'No hay resultados con ese nombre.':view==='images'?'Tu biblioteca está vacía. Sube una imagen o crea una con IA.':'Crea tu primer proyecto para agrupar chats e imágenes.';
}
function modal(kind,item={}){if(busy)return;$('#fields').replaceChildren();$('#activity').replaceChildren();$('#formError').textContent='';$('#submit').textContent=kind==='generate'?'Generar imagen':'Guardar';$('#modalTitle').textContent=({project:'Nuevo proyecto',editProject:'Editar proyecto',upload:'Subir imagen',generate:'Crear imagen con IA',editImage:'Editar imagen'})[kind];
const name=field('name','Nombre','text',item.name||'');name.required=kind!=='generate';name.maxLength=kind.includes('Project')||kind==='project'?80:120;
if(kind==='project'||kind==='editProject'){field('description','Descripción (opcional)','textarea',item.description||'').maxLength=500;}
else{projectSelect(item.projectId||$('#filter').value);if(kind==='upload'){const file=field('file','Imagen PNG, JPEG o WebP · máximo 8 MB','file');file.accept='image/png,image/jpeg,image/webp';file.required=true;}if(kind==='generate'){const prompt=field('prompt','Describe la imagen','textarea');prompt.required=true;prompt.maxLength=4000;$('#fields').append(el('p','Se genera con Gemini usando tu clave API y puede consumir saldo.','note'));}}
$('#form').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('#submit').disabled=true;$('#close').disabled=true;$('#formError').textContent='';$('#activity').replaceChildren();try{const data=Object.fromEntries(new FormData(e.target));
if(kind==='project'||kind==='editProject'){await api('/api/projects'+(kind==='editProject'?'./index.html'+item.id:''),{method:kind==='editProject'?'PATCH':'POST',body:JSON.stringify(data)});}
if(kind==='editImage')await api('/api/images/'+item.id,{method:'PATCH',body:JSON.stringify(data)});
if(kind==='upload'){if(data.file.size>8*1024*1024)throw new Error('La imagen supera 8 MB.');log('Leyendo la imagen seleccionada');const dataUrl=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('No se pudo leer la imagen.'));reader.readAsDataURL(data.file);});log('Guardando en tu biblioteca');await api('/api/images/upload',{method:'POST',body:JSON.stringify({name:data.name,projectId:data.projectId,mime:data.file.type,data:dataUrl.split(',')[1]})});log('Imagen guardada');}
if(kind==='generate'){log('Enviando la descripción a Gemini');log('Esperando la imagen del proveedor…');await api('/api/images/generate',{method:'POST',body:JSON.stringify(data)});log('Imagen recibida y guardada en la biblioteca');}
await load();if(kind!=='generate')$('#modal').close();else $('#formError').textContent='Imagen creada. Cierra este panel para verla en la biblioteca.';
}catch(e){$('#formError').textContent=e.message;log('La operación no se completó');}finally{busy=false;$('#submit').disabled=false;$('#close').disabled=false;}};$('#modal').showModal();name.focus();}
$('#close').onclick=()=>$('#modal').close();$('#modal').addEventListener('cancel',e=>{if(busy)e.preventDefault();});$('#search').oninput=render;$('#filter').onchange=render;
$('#title').textContent=view==='images'?'Imágenes':'Proyectos';$('#subtitle').textContent=view==='images'?'Crea, guarda y encuentra tus imágenes.':'Todo lo que estás construyendo, en un mismo lugar.';$('#'+view+'Nav').className='active';
if(view==='projects'){const b=el('button','＋ Nuevo proyecto','primary');b.onclick=()=>modal('project');$('#buttons').append(b);}else{const upload=el('button','Subir imagen');upload.onclick=()=>modal('upload');const generate=el('button','＋ Crear con IA','primary');generate.onclick=()=>{if(!db.canGenerate){$('#error').textContent='Conecta Gemini y activa las API desde Cuenta para generar imágenes.';return;}modal('generate');};$('#buttons').append(upload,generate);}
$('#buttons').querySelectorAll('button').forEach(b=>b.disabled=true);
load().then(()=>$('#buttons').querySelectorAll('button').forEach(b=>b.disabled=false)).catch(e=>$('#error').textContent=e.message);
</script></body></html>
